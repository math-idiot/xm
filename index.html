<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巡夢少女 活動表格</title>
<meta name="description" content="巡夢少女 活動獎勵與養成參考:各活動階段獎勵、排行獎勵、圖鑑與養成數據">
<meta property="og:type" content="website">
<meta property="og:title" content="巡夢少女 活動表格">
<meta property="og:description" content="活動獎勵與養成參考:各活動階段獎勵、排行獎勵、圖鑑與養成數據">
<meta property="og:image" content="https://math-idiot.github.io/xm/preview.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://math-idiot.github.io/xm/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#fff;--fg:#171717;--muted:#475569;--muted-bg:#f3f4f6;--border:#e5e5e5;--card:#fff;
  --accent:#a16207;--accent-bg:#fdf6e3;--side:#fafafa;--ring:#171717;--ok:#15803d;--no:#b91c1c;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#111;--fg:#ededed;--muted:#a3a3a3;--muted-bg:#1f1f1f;--border:#2e2e2e;--card:#171717;
  --accent:#e2b74a;--accent-bg:#2a2210;--side:#161616;--ring:#ededed;--ok:#4ade80;--no:#f87171;}}
:root[data-theme="dark"]{
  --bg:#111;--fg:#ededed;--muted:#a3a3a3;--muted-bg:#1f1f1f;--border:#2e2e2e;--card:#171717;
  --accent:#e2b74a;--accent-bg:#2a2210;--side:#161616;--ring:#ededed;--ok:#4ade80;--no:#f87171;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:16px;margin:0 0 12px;letter-spacing:.02em}
aside input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);margin-bottom:12px}
aside input:focus{outline:2px solid var(--ring);outline-offset:1px}
.nav-group{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 6px 6px}
.nav-sec{margin:10px 0}
.nav-sec>summary{list-style:none;cursor:pointer;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
  padding:6px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;min-height:32px}
.nav-sec>summary::-webkit-details-marker{display:none}
.nav-sec>summary:hover{background:var(--muted-bg)}
.nav-sec>summary::before{content:"▾";margin-right:6px;font-size:10px;transition:transform .15s;display:inline-block}
.nav-sec:not([open])>summary::before{transform:rotate(-90deg)}
.nav-sec>summary small{color:var(--muted);font-size:11px;letter-spacing:0}
.nav-sub{font-size:11px;color:var(--muted);margin:8px 8px 2px;opacity:.8}
.nav a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;min-height:40px;align-items:center}
.nav a:hover{background:var(--muted-bg)}
.nav a.active{background:var(--fg);color:var(--bg)}
.nav a small{color:var(--muted);font-size:12px}
.nav a.active small{color:var(--bg);opacity:.75}
main{padding:24px 32px 64px;max-width:1500px;min-width:0;margin-inline:auto;width:100%}
.hdr{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:6px}
.hdr h2{font-size:26px;margin:0}
.chip{display:inline-block;padding:2px 10px;border:1px solid var(--border);border-radius:999px;font-size:12.5px;color:var(--muted);background:var(--muted-bg)}
.chip.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin:14px 0 20px}
.thm{display:inline-flex;width:38px;height:38px;flex:0 0 38px;align-items:center;justify-content:center;
  background-size:100% 100%;background-repeat:no-repeat;vertical-align:middle;border-radius:6px}
.thm.noframe{border:1px solid var(--border);background:var(--muted-bg)}
.thm img{max-width:78%;max-height:78%;display:block}
.thm.big{width:56px;height:56px;flex:0 0 56px}
details>summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details>summary>b{margin-right:2px}
.stand.full{max-height:clamp(220px,38vw,420px)}
table.kv{border-collapse:collapse;width:100%;margin:2px 0;table-layout:fixed}
table.kv>tbody>tr>td{word-break:break-word;overflow-wrap:anywhere}
table.kv>tbody>tr>th{text-align:left;vertical-align:top;width:min(34%,190px);padding:2px 10px 2px 0;
  color:var(--muted);font-weight:500;font-size:13px;border-bottom:1px solid var(--border)}
table.kv>tbody>tr>td{padding:2px 0;border-bottom:1px solid var(--border);font-size:13px}
ol.kvlist{margin:2px 0;padding-left:20px}
ol.kvlist>li{margin:4px 0}
.suitpic{height:56px;width:auto;border-radius:6px;vertical-align:middle;margin-right:8px}
.stand{float:right;max-height:clamp(180px,26vw,260px);max-width:42%;margin:0 0 8px 14px;border-radius:8px}
@media(max-width:900px){.stand,.stand.full{float:none;display:block;margin:0 auto 10px;max-width:100%;max-height:min(50vh,360px)}}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:14px 0}
.hubcard{display:block;border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--card);
  text-decoration:none;color:var(--fg)}
.hubcard:hover{border-color:var(--accent);background:var(--accent-bg)}
.hubcard .t{font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hubcard .d{color:var(--muted);font-size:13px;margin-top:6px}
/* 飾框/貼圖:圖的比例差很多(頭像方的、聊天氣泡長條、宮牌大卡),所以不切成固定方框,
   讓圖照原比例擺在一塊有底的區域裡,底下寫名字 */
.decos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px;margin:12px 0 20px}
.decos.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.deco{border:1px solid var(--border);border-radius:10px;background:var(--card);overflow:hidden;
      display:flex;flex-direction:column}
.deco .pic{height:110px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;
           background:var(--muted-bg);position:relative}
.deco.wide .pic{height:130px}
.deco .pic img{max-width:100%;max-height:100%;object-fit:contain}
.deco .pic .none{font-size:12px;color:var(--sub)}
/* 品質用遊戲自己的品質框表示,不寫字。方形的(頭像/宮牌/貼圖)就讓圖坐在框上,
   長條的(聊天氣泡/稱號)放不下,改在角落擺一小塊同一張框 */
.deco .plate{width:94px;height:94px;display:flex;align-items:center;justify-content:center;
             background-size:contain;background-repeat:no-repeat;background-position:center}
.deco .plate img{max-width:76%;max-height:76%}
.deco .qchip{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:4px;
             background-size:contain;background-repeat:no-repeat}
.deco .nm{padding:7px 9px 2px;font-weight:500;font-size:14px}
.deco .ds{padding:0 9px 9px;font-size:12px;color:var(--sub);line-height:1.45}
/* 卡片只有 150px 寬,來源標籤常常比卡片長。標籤本身是 nowrap(不想讓玩法名被折斷),
   所以在卡片裡改成可以折行,免得整條被切掉看不到後半 */
.deco .ds .tag{white-space:normal;word-break:break-all}
.deco .series{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:12px}
.deco .series b{font-weight:500;color:var(--sub);margin-right:4px}
.deco .series small{color:var(--sub);margin-left:4px}
.deco .series a{display:inline-block;margin:3px 4px 0 0;padding:1px 6px;border-radius:4px;
                background:var(--muted-bg);color:var(--fg);text-decoration:none;font-size:11px}
.deco .series a:hover{background:var(--accent-bg);color:var(--accent)}
.deco .ds b{font-weight:500;color:var(--fg)}
.icards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin:12px 0 20px}
.icard{display:flex;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--card)}
/* 品質框用遊戲原圖(從 commonqualitynew atlas 切出),道具圖疊在上面 */
.icard .pic{position:relative;flex:0 0 64px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;
  background-size:100% 100%;background-repeat:no-repeat}
.icard .pic img{max-width:78%;max-height:78%}
.icard .pic.noframe{border:1px solid var(--border);border-radius:8px;background:var(--muted-bg)}
.icard .pic img{max-width:100%;max-height:100%;display:block}
.icard .pic.none{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.icard .txt{min-width:0}
.icard .nm{font-weight:600;margin-bottom:3px}
.icard .ds{color:var(--muted);font-size:12.5px;white-space:pre-wrap}
.icard .tags{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}
.icard .tags .chip{font-size:11px;padding:1px 7px}
.kv{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--card)}
.kv b{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.kv span{font-size:16px;font-weight:600}
.kv .null{color:var(--muted);font-weight:400;font-style:italic}
section{margin:26px 0}
section>h3{font-size:15px;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--fg);display:flex;justify-content:space-between;align-items:baseline}
section>h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.tw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--muted-bg);position:sticky;top:0}
td.num,th.num{text-align:right}
tr:hover td{background:var(--muted-bg)}
tr.total td{font-weight:700;border-top:2px solid var(--fg)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;background:var(--accent-bg);color:var(--accent);margin:1px 4px 1px 0;white-space:nowrap}
ul.notes{margin:4px 0;padding-left:20px;color:var(--muted);font-size:13.5px}
.imgs{display:flex;flex-wrap:wrap;gap:10px}
.imgs a{display:block;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--card)}
.imgs img{display:block;height:140px;width:auto;max-width:260px;object-fit:cover}
.imgs span{display:block;font-size:11.5px;color:var(--muted);padding:3px 6px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.raw pre{background:var(--muted-bg);padding:12px;border-radius:6px;font:12.5px/1.45 var(--mono);overflow:auto;max-height:60vh}
details.raw summary{cursor:pointer;color:var(--muted)}
.codex-q{width:100%;max-width:420px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font-size:15px;margin-bottom:10px}
section>details{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
section>details>summary{cursor:pointer;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
section>details[open]>summary{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.codex-count{margin-left:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.btn{padding:6px 12px;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:6px;font-size:13px;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.btn:hover{background:var(--muted-bg)}
.btn:focus-visible,.nav a:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}.nul{color:var(--muted);font-style:italic}
.md h1,.md h2{font-size:20px;margin:18px 0 8px}.md h2{font-size:17px}.md code{font:13px var(--mono);background:var(--muted-bg);padding:1px 4px;border-radius:3px}
.md table{margin:8px 0 16px}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--border);border-radius:8px}
.menu-btn{display:none}
body.print .app{grid-template-columns:1fr}body.print #side,body.print .menu-btn{display:none}body.print #main{max-width:1100px;margin:0 auto;padding:24px 32px}
@media (max-width:1150px){
  .app{grid-template-columns:220px 1fr}
  main{padding:20px 20px 56px}
}
@media (max-width:800px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;width:min(85vw,300px);z-index:10;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  main{padding:16px}
  .menu-btn{display:inline-flex;margin-bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <h1>活動表格瀏覽</h1>
  <input id="q" type="search" placeholder="搜尋活動…" aria-label="搜尋活動">
  <nav class="nav" id="nav"></nav>
</aside>
<main id="main"><button class="btn menu-btn" id="menu">☰ 選單</button><div id="view"><div class="empty">載入中…</div></div></main>
</div>
<script>
const $=s=>document.querySelector(s);
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
// 遊戲文案帶 Unity 富文本 <color=#rrggbb>…</color>,先逃脫再換成 span(只收 6 位十六進位,不讓任意標籤進來)
// 圖鑑共用:品質飾框 + 縮圖。沒有圖就只畫空框,品質不再用文字寫
function thumb(meta,file,quality,alt){
  if(!meta) return '';
  const fr=(meta.品質框||[]).includes(quality);
  const st=fr?` style="background-image:url('${enc('圖片/框/品質框_'+quality+'.png')}')"`:'';
  const img=file?`<img src="${enc('圖片/'+meta.資料夾+'/'+file)}?v=${meta.版本||''}" alt="${esc(alt||'')}" loading="lazy">`:'';
  return `<span class="thm${fr?'':' noframe'}"${st} title="${esc(quality||'')}">${img}</span>`;
}
const rich=t=>esc(t||'').replace(/&lt;color=#([0-9a-fA-F]{6})&gt;/g,'<span style="color:#$1">').replace(/&lt;\/color&gt;/g,'</span>');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fetchJ=async p=>{const r=await fetch(enc(p),{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.json()};
const fetchT=async p=>{const r=await fetch(enc(p),{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.text()};
const ROOT='網頁資料/';   // 網頁只讀這裡(由 工具/打包素材.py 從 /srv/share/xm/素材 產生)
                          // 整理/ 留著當紀錄與備案,網站不再讀它
var INDEX=[];              // var:讓冒煙測試能注入
// 圖鑑分三類,側欄只放分類,點進去才列底下的頁(內容讀 整理/90_圖鑑/目錄.json)
var CODEX_DIR=[];                       // [{分類,說明,頁面:[{id,名稱,說明,數量,單位}]}]
const CODEX_PAGES=[{id:'partner',name:'夥伴'},{id:'pet',name:'寵物'},{id:'guardian',name:'珍寶'},
  {id:'dress',name:'時裝'},{id:'car',name:'坐騎'},{id:'collect',name:'珍藏'},{id:'sticker',name:'貼紙集換'},
  {id:'itemdex',name:'道具'},{id:'equip',name:'裝備'},{id:'ability',name:'能力(學習)'},
  {id:'res',name:'資源'},{id:'deco',name:'飾框'},{id:'face',name:'貼圖'},
  {id:'emo',name:'表情符號'}];
const GROWTH_PAGES=[{id:'cult',name:'夥伴'},{id:'g_寵物',name:'寵物'},{id:'g_時裝',name:'時裝'},
  {id:'g_珍寶',name:'珍寶'},{id:'g_珍藏',name:'珍藏'},{id:'g_坐騎',name:'坐騎'},{id:'g_裝備',name:'裝備'}];
// 側欄的圖鑑順序直接照「養成」那七類推出來,兩邊才不會各自漂走;
// 沒有對應養成的(貼紙集換/道具/能力)接在後面
const CODEX_NAV=[...GROWTH_PAGES.map(g=>CODEX_PAGES.find(c=>c.name===g.name)).filter(Boolean),
  ...CODEX_PAGES.filter(c=>!GROWTH_PAGES.some(g=>g.name===c.name))];
const SPECIAL=[{id:'overview',name:'總覽與規則'},...CODEX_PAGES,...GROWTH_PAGES,{id:'item',name:'道具查詢'},{id:'doc',name:'欄位說明'}];

// 獲取途徑:[{名稱,說明,開啟條件}] → 一排標籤,條件寫在括號裡
const gw=l=>!l||!l.length?'':l.map(g=>`<span class="tag" title="${esc(g.說明||'')}">${esc(g.名稱)}${g.開啟條件?` <small>(${esc(g.開啟條件)})</small>`:''}</span>`).join('');
const gwText=l=>!l||!l.length?'—':l.map(g=>g.名稱+(g.開啟條件?`(${g.開啟條件})`:'')).join('、');
const yn=v=>v===null||v===undefined?'<span class="nul">null</span>':v===true?'<span class="ok">有</span>':v===false?'<span class="no">無</span>':esc(v);
const fmtReq=l=>(l||[]).map(x=>`${esc(x.項目??x.道具)}${x.數量??''}${x.單位??''}`).join('、');
const fmtPrize=l=>(l||[]).map(x=>`<span class="tag">${esc(x.道具)}${x.數量??''}${x.單位??''}${x.備註?'('+esc(x.備註)+')':''}</span>`).join('');
const kv=(k,v,isNull)=>`<div class="kv"><b>${k}</b><span class="${isNull?'null':''}">${v}</span></div>`;

function renderActivity(a,folder){
  const n=v=>v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length);
  let h=`<div class="hdr"><h2>${esc(a.名稱)}</h2>
    ${(a.別名||[]).map(x=>`<span class="chip">別名 ${esc(x)}</span>`).join('')}
    ${a.分類?`<span class="chip acc">${esc(a.分類)}</span>`:''}${a.類型?`<span class="chip">${esc(a.類型)}</span>`:''}
    ${a.系列?`<span class="chip">系列 ${esc(a.系列)}:${(a.輪替版本||[]).map(esc).join(' / ')}</span>`:''}</div>`;
  h+=`<div class="grid">${kv('時長',n(a.時長)?'null':esc(a.時長),n(a.時長))}${kv('結算',n(a.結算)?'null':esc(a.結算),n(a.結算))}
    ${kv('需求單位',esc(a.需求單位))}${kv('階段數',a.階段數)}${kv('全拿總需求',n(a.全拿總需求)?'null':a.全拿總需求,n(a.全拿總需求))}
    ${kv('是否補發獎勵',yn(a.是否補發獎勵))}
    ${kv('個人排行榜',`有:${yn(a.排行榜?.個人排行榜?.有)} 獎勵:${yn(a.排行榜?.個人排行榜?.獎勵)}`)}
    ${kv('家族排行榜',`有:${yn(a.排行榜?.家族排行榜?.有)} 獎勵:${yn(a.排行榜?.家族排行榜?.獎勵)}`)}</div>`;

function tableFromObjs(rows){
  if(!rows?.length) return '<div class="empty">無資料</div>';
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  // 包一層可橫向捲動的容器:養成那些表格欄位很多,不包的話會把整頁撐寬
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${typeof r[c]==='object'&&r[c]!==null?esc(JSON.stringify(r[c])):esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function stageTable(stages,extraCols=[]){
  if(!stages?.length) return '<div class="empty">待補</div>';
  const mats=[];stages.forEach(s=>s.素材.forEach(m=>{const k=m.名稱+(m.碎片種類?'('+m.碎片種類+')':'');if(!mats.includes(k))mats.push(k)}));
  let h=`<table><thead><tr><th>等級</th>${mats.map(m=>`<th class="num">${esc(m)}</th><th class="num">${esc(m)}累計</th>`).join('')}${extraCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  const run={};  // 該階沒有這種素材時顯示 0,累計延續前一階
  for(const s of stages){h+=`<tr><td>${s.等級??((s.階??'')+'-'+(s.級??''))}</td>`;for(const m of mats){const x=s.素材.find(y=>y.名稱+(y.碎片種類?'('+y.碎片種類+')':'')===m);const q=x?x.數量:0;run[m]=x&&x.累計!=null?x.累計:((run[m]??0)+(q??0));h+=`<td class="num">${q??''}</td><td class="num">${run[m]}</td>`;}h+=extraCols.map(c=>`<td>${esc(s[c]??'')}</td>`).join('')+'</tr>';}
  return h+'</tbody></table>';
}

function md(t){ // tiny markdown: headings, tables, lists, code, paragraphs
  const lines=t.split('\n');let out='',i=0,inList=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  while(i<lines.length){const l=lines[i];
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      out+=`<table><thead><tr>${cells(rows[0]).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;continue;}
    if(inList&&!/^- /.test(l)){out+='</ul>';inList=false;}
    if(/^# /.test(l))out+=`<h1>${inline(l.slice(2))}</h1>`;else if(/^## /.test(l))out+=`<h2>${inline(l.slice(3))}</h2>`;
    else if(/^- /.test(l)){if(!inList){out+='<ul class="notes">';inList=true;}out+=`<li>${inline(l.slice(2))}</li>`;}
    else if(l.trim())out+=`<p>${inline(l)}</p>`;
    i++;}
  if(inList)out+='</ul>';return `<div class="md">${out}</div>`;
}

function searchBox(ph){
  return `<input class="codex-q" placeholder="${ph}" oninput="codexFilter(this)">`;

function codexFilter(el){
  const q=el.value.trim().toLowerCase();
  // 搜尋框通常跟卡片在同一個 section,但飾框/貼圖那幾頁是一個種類一個 section、
  // 搜尋框自己一個。那種情況要往外找到整頁,不然搜了沒反應。
  let box=el.closest('section')||el.parentElement;
  if(!box.querySelector('[data-k]')) box=document.getElementById('view')||box;
  box.querySelectorAll('[data-k]').forEach(r=>{r.style.display=!q||r.dataset.k.includes(q)?'':'none';});
  const n=[...box.querySelectorAll('[data-k]')].filter(r=>r.style.display!=='none').length;
  const c=box.querySelector('.codex-count'); if(c) c.textContent=`${n} 筆`;
}

// 飾框與貼圖。縮圖是照 icon 命名的(圖片/飾框/<icon>.png),所以用 `圖示` 那欄,
// 不是素材樹自己的檔名。一筆可以有好幾張圖(宮牌四張、聊天氣泡左右兩張)——那是拼起來的,
// 不是同一張的別名,所以全部並排畫出來。
const decoImg=(x,k)=>`<img src="${'圖片/飾框/'}${encodeURIComponent(k)}.png" alt="${esc(x.名稱)}" loading="lazy">`;
const PLATE=q=>q?`url('${enc('圖片/框/品質框_'+q+'.png')}')`:'';
// 來源的優先順序:遊戲自己在道具說明裡寫的那句最準,其次是 GetWay 那排「可前往×××」,
// 最後才是我掃設定表反查出來的。反查到「掉落池(來源待查)」而且已經有別的具名來源時就不列 ——
// 旁邊已經寫著「心與喵窩活動中獲得」還掛一個「來源待查」,是自相矛盾。
// 來源一律只寫名字(「畫冊收集」),因為那是一個可以點過去的去處。
// 同一個來源會從三條路各講一次(說明抽出來的、GetWay 的、反查的),
// 比對時把「歷練」這種尾巴剃掉再比,留字多的那個(「京城歷練」勝過「京城」)。
const srcKey=t=>String(t).replace(/歷練$/,'').trim()||String(t);
function decoSrc(x){
  const named=(x.反查來源||[]).filter(t=>!/待查/.test(t));
  const vague=(x.反查來源||[]).filter(t=>/待查/.test(t));
  // 條件(幾級開放)屬於那個玩法自己的頁面,不寫在這張卡上
  let all=[...(x.獲取說明||[]),...(x.獲取||[]).map(g=>g.名稱),...named];
  if(!all.length) all=vague;
  // 已經查到是哪一個去處(「京城歷練」「畫冊商店」)就不要再掛籠統的那個
  if(all.some(t=>/.歷練$/.test(t))) all=all.filter(t=>t!=='進行歷練'&&t!=='歷練地點');
  if(all.some(t=>t.length>2&&/(商店|商城)$/.test(t))) all=all.filter(t=>t!=='商店'&&t!=='商城');
  const best=new Map();
  for(const t of all){const k=srcKey(t);if(!best.has(k)||t.length>best.get(k).length)best.set(k,t);}
  return [...best.values()].map(t=>`<span class="tag">${esc(t)}</span>`).join('');
}
// 同一個主題常常同時出頭像/頭像框/聊天氣泡/宮牌/稱號(「一念枯榮」有五件)。
// 點系列裡的任何一件就把整頁篩成那一組 —— 這幾件分散在不同種類的區塊,不然找不到彼此。
function decoSeries(x){
  const s=x.系列; if(!s) return '';
  const others=(s.成員||[]).filter(m=>!(m.種類===x.種類&&m.名稱===x.名稱));
  if(!others.length) return '';
  return `<div class="series"><b>系列</b> ${esc(s.名稱)}<small>${s.件數} 件</small>
    ${others.map(m=>`<a href="#" onclick="return decoPick(this,'${esc(s.名稱)}')">${esc(m.種類)}</a>`).join('')}</div>`;
}
function decoPick(el,name){
  const q=document.querySelector('.codex-q');
  if(q){ q.value=name; codexFilter(q); q.scrollIntoView({block:'center'}); }
  return false;
}
function decoCard(x,wide){
  const ks=x.圖示||[];
  const plate=PLATE(x.品質);
  let pic;
  if(!ks.length) pic='<span class="none">沒有圖</span>';
  else if(wide) pic=ks.map(k=>decoImg(x,k)).join('')+
      (plate?`<span class="qchip" style="background-image:${plate}" title="${esc(x.品質)}"></span>`:'');
  else pic=ks.map(k=>`<span class="plate" style="background-image:${plate}" title="${esc(x.品質||'')}">${decoImg(x,k)}</span>`).join('');
  return `<div class="deco${wide?' wide':''}" data-k="${esc([x.名稱,x.種類,x.品質,x.子分頁||'',x.說明||''].join(' ').toLowerCase())}">
    <div class="pic">${pic}</div>
    <div class="nm">${esc(x.名稱)}</div>
    <div class="ds">${x.子分頁?`<b>${esc(x.子分頁)}</b><br>`:''}${esc(x.說明||'')}${decoSrc(x)}
      ${decoSeries(x)}</div></div>`;
}
const DECO_ORDER=['頭像','頭像框','聊天氣泡','宮牌','天幕','稱號'];
const DECO_WIDE=new Set(['聊天氣泡','宮牌','天幕','稱號']);

async function renderDeco(){
  const d=await codex('飾框');
  const byKind=new Map();
  for(const x of d.飾框) (byKind.get(x.種類)||byKind.set(x.種類,[]).get(x.種類)).push(x);
  const kinds=[...DECO_ORDER.filter(k=>byKind.has(k)),...[...byKind.keys()].filter(k=>!DECO_ORDER.includes(k))];
  let h=`<div class="hdr"><h2>飾框</h2><span class="chip">${d.數量} 個</span><span class="chip acc">${(d.圖片||{}).有圖} 個有圖</span></div><p class="sub">${esc(d.說明)}</p>`;
  h+=`<section>${searchBox('搜尋名稱 / 種類 / 說明…')} <span class="codex-count sub"></span></section>`;
  for(const k of kinds){
    const list=byKind.get(k), wide=DECO_WIDE.has(k), got=list.filter(x=>x.圖示).length;
    h+=`<section><h3>${esc(k)} <small>${list.length} 個 · ${got} 個有圖</small></h3>

  }
  return h;
}

//   表情符號 = 96px 的小圓臉(一欄小格)   貼圖 = 400px 的角色大圖(一欄大格)
async function renderFace(cat){

  const byTab=new Map();
  for(const x of list){const k=x.子分頁||'其他';if(!byTab.has(k))byTab.set(k,[]);byTab.get(k).push(x)}
  let h=`<div class="hdr"><h2>${esc(cat)}</h2><span class="chip">${d.數量} 個</span><span class="chip acc">${(d.圖片||{}).有圖} 個有圖</span></div><p class="sub">${esc(d.說明)}</p>`;

// 資料檢查:把一筆資料的每個欄位原樣攤開,不挑、不美化。
// 這頁的用途是校對資料庫,所以寧可醜也不能漏欄位 —— 各圖鑑那些是挑過的呈現,這裡不是。
function kvTree(v,depth=0){
  if(v===null||v===undefined) return '<span class="nul">null</span>';
  if(Array.isArray(v)){
    if(!v.length) return '<span class="nul">[]</span>';
    if(v.every(x=>x===null||typeof x!=='object'))
      return v.map(x=>`<span class="tag">${esc(String(x))}</span>`).join('');
    return `<ol class="kvlist">${v.map(x=>`<li>${kvTree(x,depth+1)}</li>`).join('')}</ol>`;
  }
  if(typeof v==='object'){
    const rows=Object.entries(v).map(([k,x])=>
      `<tr><th>${esc(k)}</th><td>${kvTree(x,depth+1)}</td></tr>`).join('');
    return `<table class="kv">${rows}</table>`;
  }
  const t=String(v);
  return /\.(png|webp|jpg)$/i.test(t)?`<code>${esc(t)}</code>`:rich(esc(t));
}

const TPLDATA={};
async function renderDetail(cat,who){
  const t=TPL[cat]; if(!t) return `<div class="empty">還沒有「${esc(cat)}」的詳細頁範本</div>`;
  const d=TPLDATA[cat] ??= await fetchJ(ROOT+t.來源);
  const list=d[t.清單]||[];
  const x=list.find(i=>String(i.名稱||i.套裝名)===who)||list.find(i=>String(i.id??i.編號)===who);
  if(!x) return `<div class="empty">${esc(cat)}裡找不到「${esc(who)}」</div>`;
  PAGE_TITLE=`${x.名稱||x.套裝名} · ${cat}`;
  const img=(t.圖夾&&x.圖)?`<img src="${enc('圖片/'+t.圖夾+'/'+x.圖)}" alt="" style="width:64px;height:64px;object-fit:contain">`:'';
  const stand=(t.立繪&&t.立繪(x))?`<img class="stand full" src="${enc('圖片/'+(d.立繪圖片||{}).資料夾+'/'+t.立繪(x))}" alt="" loading="lazy">`:'';
  let h=`<p class="sub"><a href="#raw_${encodeURIComponent(cat)}">← ${esc(cat)}</a></p>
    <div class="hdr">${img}<h2>${esc(String(x.名稱||x.套裝名))}</h2>
      ${(t.徽章?t.徽章(x):[]).filter(Boolean).map(b=>`<span class="chip">${esc(b)}</span>`).join('')}</div>
    ${t.副標?`<p class="sub">${esc(t.副標(x)||'')}</p>`:''}${stand}`;
  for(const b of t.區塊){
    const body=(BLK[b.型]||(()=>''))(b,x);
    if(body) h+=`<section><h3>${esc(b.標題)}</h3>${body}</section>`;
  }
  return h;
}
// 從別的地方引用過來:用類別+名字找,找到就跳詳細頁
async function renderFind(cat,who){
  if(TPL[cat]) return renderDetail(cat,who);
  const src=RAWSRC[cat];
  if(!src) return `<div class="empty">找不到「${esc(cat)}」</div>`;
  const d=RAW[cat] ??= await fetchJ(ROOT+src);
  const k=Object.keys(d).find(x=>Array.isArray(d[x])&&d[x].length&&typeof d[x][0]==='object');
  const it=(d[k]||[]).find(i=>String(i.名稱)===who);
  if(!it) return `<div class="empty">${esc(cat)}裡找不到「${esc(who)}」</div>`;
  PAGE_TITLE=`${who} · ${cat}`;
  return `<div class="hdr"><h2>${esc(who)}</h2><span class="chip">${esc(cat)}</span></div>
    <p class="sub">這一類還沒有詳細頁範本,先把所有欄位列出來</p>${kvTree(it)}`;
}

async function renderRaw(cat){
  const src=RAWSRC[cat]; if(!src) return `<div class="empty">沒有「${esc(cat)}」這一類</div>`;
  const d=RAW[cat] ??= await fetchJ(ROOT+src);
  const listKey=Object.keys(d).find(k=>Array.isArray(d[k])&&d[k].length&&typeof d[k][0]==='object');
  const items=d[listKey]||[];
  const meta=Object.fromEntries(Object.entries(d).filter(([k])=>k!==listKey));
  let h=`<div class="hdr"><h2>${esc(cat)} · 資料檢查</h2><span class="chip">${items.length} 筆</span></div>
    <p class="sub">把資料庫裡的每一個欄位原樣列出來,用來校對。這頁不挑欄位也不美化,跟圖鑑頁不一樣。</p>
    <details><summary class="sub">這一類的共用欄位(說明、圖片設定、範本那些)</summary>${kvTree(meta)}</details>`;
  h+=`<section>${searchBox('搜尋任何欄位的內容…')} <span class="codex-count sub"></span>`;
  for(const it of items){
    const nm=it.名稱||it.套裝名||it.標題||it.檔名||it.id||'(無名)';

      <span class="chip">${Object.keys(it).length} 欄</span>${link}</summary>${kvTree(it)}</details>`;
  }
  return h+`</section>`;
}

const GROWTH={};
function fillGrowth(el){
  if(el.dataset.done||!el.open) return;
  el.dataset.done='1';
  const d=GROWTH[el.dataset.page];
  const g=d?.區塊?.[+el.dataset.b]?.分組?.[+el.dataset.g];
  el.querySelector('.tpl-body').innerHTML=g?tableFromObjs(g.表格):'<div class="empty">沒有資料</div>';
}
async function renderGrowth(name){
  const d=GROWTH[name] ??= await fetchJ(ROOT+'91_養成/'+name+'.json');
  let h=`<div class="hdr"><h2>${esc(name)}養成</h2></div><p class="sub">${esc(d.說明)}</p>`;
  d.區塊.forEach((b,bi)=>{
    h+=`<section><h3>${esc(b.標題)}</h3>${b.說明?`<p class="sub">${esc(b.說明)}</p>`:''}`;
    if(b.表格?.length) h+=tableFromObjs(b.表格);
    (b.分組||[]).forEach((g,gi)=>{
      h+=`<details style="margin-top:8px" data-page="${esc(name)}" data-b="${bi}" data-g="${gi}" ontoggle="fillGrowth(this)"><summary class="sub">${esc(g.標題)}</summary><div class="tpl-body"><div class="empty">展開中…</div></div></details>`;
    });
    h+=`</section>`;
  });
  return h;
}

async function renderCodexHub(name){
  const g=CODEX_DIR.find(x=>x.分類===name);
  if(!g) return `<div class="empty">找不到分類「${esc(name)}」</div>`;
  let h=`<div class="hdr"><h2>${esc(g.分類)}</h2><span class="chip">${g.頁面.length} 個圖鑑</span></div>
    <p class="sub">${esc(g.說明||'')}</p><div class="hub">`;
  for(const p of g.頁面){
    h+=`<a class="hubcard" href="#${p.id}">
      <div class="t">${esc(p.名稱)}${p.數量!=null?`<span class="chip">${p.數量} ${esc(p.單位||'筆')}</span>`:''}</div>
      <div class="d">${esc(p.說明||'')}</div></a>`;
  }
  return h+`</div>`;
}

async function renderItemCodex(){
  const d=await codex('道具');
  let h=`<div class="hdr"><h2>道具圖鑑</h2><span class="chip">${d.數量} 個</span><span class="chip acc">${d.有圖} 個有圖</span></div>
    <p class="sub">${esc(d.說明)}</p>`;
  h+=`<section>${searchBox('搜尋道具名稱 / 說明 / 品質 / 分頁…')} <span class="codex-count sub"></span>
    <span style="float:right"><button class="btn" onclick="setItemMode('table')">改看表格</button></span>`;
  const tabs=d.分頁||[];
  for(const tab of tabs){
    const list=d.道具.filter(x=>x.背包分頁===tab);
    if(!list.length) continue;
    h+=`<h3 style="margin-top:16px">背包：${esc(tab)} <small>${list.length} 個</small></h3><div class="icards">`;
    for(const it of list){
      const k=[it.名稱,it.背包分頁,it.分類,it.品質,it.說明||'',gwText(it.獲取)].join(' ').toLowerCase();
      const fr=(d.品質框||[]).includes(it.品質);
      const cls=fr?'pic':'pic noframe';
      const style=fr?` style="background-image:url('${enc('圖片/框/品質框_'+it.品質+'.png')}')" title="${esc(it.品質)}"`:` title="${esc(it.品質)}"`;
      const pic=it.圖
        ? `<div class="${cls}"${style}><img src="${enc('圖片/道具/'+it.圖)}?v=${d.圖片版本||''}" alt="${esc(it.名稱)}" loading="lazy"></div>`
        : `<div class="${cls} none"${style}>沒有<br>圖檔</div>`;
      h+=`<div class="icard" data-k="${esc(k)}">${pic}<div class="txt">
        <div class="nm">${esc(it.名稱)}</div>
        <div class="tags"><span class="chip">${esc(it.分類)}</span>${it.售價?`<span class="chip">賣 ${it.售價}</span>`:''}</div>
        <div class="ds">${rich(it.說明||'—')}</div>
        ${it.獲取?`<div class="ds"><b>獲取</b> ${gw(it.獲取)}</div>`:''}</div></div>`;
    }
    h+=`</div>`;
  }
  return h+`</section>`;
}

function setItemMode(m){ try{localStorage.setItem('itemMode',m)}catch(e){}; show(m==='table'?'item':'itemdex'); }
async function renderItems(){
  const d=await codex('道具');
  let h=`<div class="hdr"><h2>道具查詢</h2><span class="chip">${d.數量} 個</span></div><p class="sub">${esc(d.說明)}</p>`;
  h+=`<section>${searchBox('搜尋道具名稱 / 說明…')} <span class="codex-count sub"></span>
    <span style="float:right"><button class="btn" onclick="setItemMode('card')">改看圖卡</button></span>
    <table><thead><tr><th>名稱</th><th>分頁</th><th>分類</th><th>品質</th><th>說明</th><th>獲取</th></tr></thead><tbody>`;
  for(const it of d.道具){
    const k=[it.名稱,it.分類,it.品質,it.說明||'',gwText(it.獲取)].join(' ').toLowerCase();
    h+=`<tr data-k="${esc(k)}"><td>${esc(it.名稱)}</td><td>${esc(it.背包分頁)}</td><td>${esc(it.分類)}</td><td>${esc(it.品質)}</td><td class="sub">${rich((it.說明||'').replace(/\n/g,' '))}</td><td class="sub">${gw(it.獲取)||'—'}</td></tr>`;
  }
  return h+`</tbody></table></section>`;
}

var PAGE_TITLE='';              // 渲染函式可以覆寫頁籤標題(主題/畫冊這種動態頁用)
async function show(id){
  const v=$('#view'); v.innerHTML='<div class="empty">載入中…</div>'; PAGE_TITLE='';
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  $('#side').classList.remove('open');
  try{
    if(id.startsWith('cx_')) v.innerHTML=await renderCodexHub(decodeURIComponent(id.slice(3)));
    else if(id==='overview') v.innerHTML=await renderOverview();
    else if(id==='cult') v.innerHTML=await renderCult();
    else if(id==='partner') v.innerHTML=await renderPartners();
    else if(id==='dress') v.innerHTML=await renderDress();
    else if(id==='pet') v.innerHTML=await renderPets();
    else if(id==='ability') v.innerHTML=await renderAbilities();
    else if(id==='guardian') v.innerHTML=await renderGuardian();
    else if(id==='collect') v.innerHTML=await renderCollect();
    else if(id==='car') v.innerHTML=await renderCar();
    else if(id==='equip') v.innerHTML=await renderEquip();
    else if(id==='sticker') v.innerHTML=await renderSticker();
    else if(id==='deco') v.innerHTML=await renderDeco();
    else if(id==='face') v.innerHTML=await renderFace('貼圖');
    else if(id==='emo') v.innerHTML=await renderFace('表情符號');
    else if(id.startsWith('st_')) v.innerHTML=await renderStickerTheme(decodeURIComponent(id.slice(3)));
    else if(id.startsWith('sa_')) v.innerHTML=await renderStickerAlbum(id.slice(3));
    else if(id.startsWith('g_')) v.innerHTML=await renderGrowth(id.slice(2));
    else if(id==='itemdex') v.innerHTML=await renderItemCodex();
    else if(id==='res') v.innerHTML=await renderRes();
    else if(id.startsWith('raw_')) v.innerHTML=await renderRaw(decodeURIComponent(id.slice(4)));
    else if(id.startsWith('detail/')){const [,c,w]=id.split('/');v.innerHTML=await renderDetail(decodeURIComponent(c),decodeURIComponent(w));}
    else if(id.startsWith('find/')){const [,c,w]=id.split('/');v.innerHTML=await renderFind(decodeURIComponent(c),decodeURIComponent(w));}
    else if(id==='item') v.innerHTML=await renderItems();
    else if(id==='doc') v.innerHTML=`<div class="hdr"><h2>欄位說明</h2></div>`+md(await fetchT(ROOT+'欄位說明.md'));
    else { const a=await fetchJ(ROOT+id+'/活動.json'); v.innerHTML=renderActivity(a,id); }
    document.title=(PAGE_TITLE||(id.startsWith('cx_')?decodeURIComponent(id.slice(3)):(INDEX.find(x=>x.資料夾===id)?.名稱||SPECIAL.find(s=>s.id===id)?.name||id)))+' · 巡夢少女 活動表格';
  }catch(e){v.innerHTML=`<div class="empty">載入失敗:${esc(e.message)}</div>`;}
  window.scrollTo(0,0);
}
const NAVOPEN=k=>{try{return localStorage.getItem('nav:'+k)!=='0'}catch(e){return true}};
function navToggle(el,k){try{localStorage.setItem('nav:'+k,el.open?'1':'0')}catch(e){}}
function buildNav(filter=''){
  const f=filter.trim().toLowerCase();
  const link=s=>`<a href="#${s.id}" data-id="${s.id}"><span>${s.name}</span></a>`;
  const keep=s=>!f||s.name.toLowerCase().includes(f);
  // 有在搜尋時全部展開,不然找不到東西
  const sec=(k,title,body,n)=>!body?'':`<details class="nav-sec" ${f||NAVOPEN(k)?'open':''} ontoggle="navToggle(this,'${k}')">
    <summary>${title}${n!=null?`<small>${n}</small>`:''}</summary>${body}</details>`;
  const acts=INDEX.filter(a=>!f||(a.名稱+a.資料夾+(a.分類||'')+(a.類型||'')).toLowerCase().includes(f));
  let h=sec('act','活動',acts.map(a=>`<a href="#${encodeURIComponent(a.資料夾)}" data-id="${esc(a.資料夾)}"><span>${esc(a.名稱)}</span><small>${esc(a.分類||'')}</small></a>`).join(''),acts.length);
  h+=sec('codex','圖鑑',CODEX_NAV.filter(keep).map(link).join(''));
  h+=sec('growth','養成',GROWTH_PAGES.filter(keep).map(link).join(''));
  h+=sec('raw','資料檢查',Object.keys(RAWSRC)
    .filter(c=>!f||c.toLowerCase().includes(f))
    .map(c=>`<a href="#raw_${encodeURIComponent(c)}" data-id="raw_${esc(c)}"><span>${esc(c)}</span></a>`).join(''));
  h+=sec('other','其他',[{id:'overview',name:'總覽與規則'},{id:'item',name:'道具查詢(純表格)'},{id:'doc',name:'欄位說明'}].filter(keep).map(link).join(''));
  $('#nav').innerHTML=h;
  const cur=decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===cur));
}
(async()=>{
  try{INDEX=await fetchJ(ROOT+'目錄.json');}catch(e){$('#view').innerHTML=`<div class="empty">讀不到 整理/目錄.json:${esc(e.message)}</div>`;return;}
  try{CODEX_DIR=(await fetchJ(ROOT+'90_圖鑑/目錄.json')).分類||[];}catch(e){CODEX_DIR=[];}
  buildNav();
  $('#q').addEventListener('input',e=>buildNav(e.target.value));
  $('#menu').addEventListener('click',()=>$('#side').classList.toggle('open'));
  const go=()=>show(decodeURIComponent(location.hash.slice(1))||INDEX[0].資料夾);
  if(location.search.includes('print')) document.body.classList.add('print');
  window.addEventListener('hashchange',go); go();
})();
</script>
