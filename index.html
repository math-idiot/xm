<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巡夢少女 活動表格</title>
<meta name="description" content="巡夢少女 活動獎勵與養成參考:各活動階段獎勵、排行獎勵、圖鑑與養成數據">
<meta property="og:type" content="website">
<meta property="og:title" content="巡夢少女 活動表格">
<meta property="og:description" content="活動獎勵與養成參考:各活動階段獎勵、排行獎勵、圖鑑與養成數據">
<meta property="og:image" content="https://math-idiot.github.io/xm/preview.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://math-idiot.github.io/xm/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#fff;--fg:#171717;--muted:#475569;--muted-bg:#f3f4f6;--border:#e5e5e5;--card:#fff;
  --accent:#a16207;--accent-bg:#fdf6e3;--side:#fafafa;--ring:#171717;--ok:#15803d;--no:#b91c1c;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#111;--fg:#ededed;--muted:#a3a3a3;--muted-bg:#1f1f1f;--border:#2e2e2e;--card:#171717;
  --accent:#e2b74a;--accent-bg:#2a2210;--side:#161616;--ring:#ededed;--ok:#4ade80;--no:#f87171;}}
:root[data-theme="dark"]{
  --bg:#111;--fg:#ededed;--muted:#a3a3a3;--muted-bg:#1f1f1f;--border:#2e2e2e;--card:#171717;
  --accent:#e2b74a;--accent-bg:#2a2210;--side:#161616;--ring:#ededed;--ok:#4ade80;--no:#f87171;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:16px;margin:0 0 12px;letter-spacing:.02em}
aside input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);margin-bottom:12px}
aside input:focus{outline:2px solid var(--ring);outline-offset:1px}
.nav-group{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 6px 6px}
.nav a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;min-height:40px;align-items:center}
.nav a:hover{background:var(--muted-bg)}
.nav a.active{background:var(--fg);color:var(--bg)}
.nav a small{color:var(--muted);font-size:12px}
.nav a.active small{color:var(--bg);opacity:.75}
main{padding:24px 32px 64px;max-width:1300px;min-width:0}
.hdr{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:6px}
.hdr h2{font-size:26px;margin:0}
.chip{display:inline-block;padding:2px 10px;border:1px solid var(--border);border-radius:999px;font-size:12.5px;color:var(--muted);background:var(--muted-bg)}
.chip.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:14px 0 20px}
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:12px 0 20px}
.icard{display:flex;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--card)}
.icard .pic{--q:var(--ql,var(--border));position:relative;flex:0 0 64px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--q,var(--border));border-radius:8px;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--q,#888) 26%,transparent),color-mix(in srgb,var(--q,#888) 8%,transparent))}
.icard .pic::before,.icard .pic::after{content:"";position:absolute;width:7px;height:7px;border:2px solid var(--q,var(--border));opacity:.9}
.icard .pic::before{top:1px;left:1px;border-right:0;border-bottom:0;border-radius:3px 0 0 0}
.icard .pic::after{bottom:1px;right:1px;border-left:0;border-top:0;border-radius:0 0 3px 0}
.icard .pic img{max-width:100%;max-height:100%;display:block}
.icard .pic.none{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.icard .txt{min-width:0}
.icard .nm{font-weight:600;margin-bottom:3px}
.icard .ds{color:var(--muted);font-size:12.5px;white-space:pre-wrap}
.icard .tags{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}
.icard .tags .chip{font-size:11px;padding:1px 7px}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .icard .pic{--q:var(--qd,var(--border))} }
:root[data-theme="dark"] .icard .pic{--q:var(--qd,var(--border))}
.kv{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--card)}
.kv b{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.kv span{font-size:16px;font-weight:600}
.kv .null{color:var(--muted);font-weight:400;font-style:italic}
section{margin:26px 0}
section>h3{font-size:15px;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--fg);display:flex;justify-content:space-between;align-items:baseline}
section>h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--muted-bg);position:sticky;top:0}
td.num,th.num{text-align:right}
tr:hover td{background:var(--muted-bg)}
tr.total td{font-weight:700;border-top:2px solid var(--fg)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;background:var(--accent-bg);color:var(--accent);margin:1px 4px 1px 0;white-space:nowrap}
ul.notes{margin:4px 0;padding-left:20px;color:var(--muted);font-size:13.5px}
.imgs{display:flex;flex-wrap:wrap;gap:10px}
.imgs a{display:block;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--card)}
.imgs img{display:block;height:140px;width:auto;max-width:260px;object-fit:cover}
.imgs span{display:block;font-size:11.5px;color:var(--muted);padding:3px 6px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.raw pre{background:var(--muted-bg);padding:12px;border-radius:6px;font:12.5px/1.45 var(--mono);overflow:auto;max-height:60vh}
details.raw summary{cursor:pointer;color:var(--muted)}
.codex-q{width:100%;max-width:420px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font-size:15px;margin-bottom:10px}
section>details{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
section>details>summary{cursor:pointer;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
section>details[open]>summary{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.codex-count{margin-left:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.btn{padding:6px 12px;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:6px;font-size:13px;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.btn:hover{background:var(--muted-bg)}
.btn:focus-visible,.nav a:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}.nul{color:var(--muted);font-style:italic}
.md h1,.md h2{font-size:20px;margin:18px 0 8px}.md h2{font-size:17px}.md code{font:13px var(--mono);background:var(--muted-bg);padding:1px 4px;border-radius:3px}
.md table{margin:8px 0 16px}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--border);border-radius:8px}
.menu-btn{display:none}
body.print .app{grid-template-columns:1fr}body.print #side,body.print .menu-btn{display:none}body.print #main{max-width:1100px;margin:0 auto;padding:24px 32px}
@media (max-width:800px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;width:min(85vw,300px);z-index:10;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  main{padding:16px}
  .menu-btn{display:inline-flex;margin-bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <h1>活動表格瀏覽</h1>
  <input id="q" type="search" placeholder="搜尋活動…" aria-label="搜尋活動">
  <nav class="nav" id="nav"></nav>
</aside>
<main id="main"><button class="btn menu-btn" id="menu">☰ 選單</button><div id="view"><div class="empty">載入中…</div></div></main>
</div>
<script>
const $=s=>document.querySelector(s);
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
// 遊戲文案帶 Unity 富文本 <color=#rrggbb>…</color>,先逃脫再換成 span(只收 6 位十六進位,不讓任意標籤進來)
const rich=t=>esc(t||'').replace(/&lt;color=#([0-9a-fA-F]{6})&gt;/g,'<span style="color:#$1">').replace(/&lt;\/color&gt;/g,'</span>');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fetchJ=async p=>{const r=await fetch(enc(p),{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.json()};
const fetchT=async p=>{const r=await fetch(enc(p),{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.text()};
const ROOT='整理/';
let INDEX=[];
const CODEX_PAGES=[{id:'partner',name:'夥伴圖鑑'},{id:'pet',name:'寵物圖鑑'},{id:'dress',name:'時裝圖鑑'},
  {id:'guardian',name:'珍寶圖鑑'},{id:'collect',name:'珍藏圖鑑'},{id:'car',name:'坐騎圖鑑'},{id:'equip',name:'裝備圖鑑'},
  {id:'ability',name:'能力(學習)'},{id:'sticker',name:'貼紙集換'},
  {id:'itemdex',name:'道具圖鑑'},{id:'item',name:'道具查詢'}];
const GROWTH_PAGES=[{id:'cult',name:'夥伴養成'},{id:'g_寵物',name:'寵物養成'},{id:'g_時裝',name:'時裝養成'},
  {id:'g_珍寶',name:'珍寶養成'},{id:'g_珍藏',name:'珍藏養成'},{id:'g_坐騎',name:'坐騎養成'},{id:'g_裝備',name:'裝備養成'}];
const SPECIAL=[{id:'overview',name:'總覽與規則'},...CODEX_PAGES,...GROWTH_PAGES,{id:'doc',name:'欄位說明'}];

const yn=v=>v===null||v===undefined?'<span class="nul">null</span>':v===true?'<span class="ok">有</span>':v===false?'<span class="no">無</span>':esc(v);
const fmtReq=l=>(l||[]).map(x=>`${esc(x.項目??x.道具)}${x.數量??''}${x.單位??''}`).join('、');
const fmtPrize=l=>(l||[]).map(x=>`<span class="tag">${esc(x.道具)}${x.數量??''}${x.單位??''}${x.備註?'('+esc(x.備註)+')':''}</span>`).join('');
const kv=(k,v,isNull)=>`<div class="kv"><b>${k}</b><span class="${isNull?'null':''}">${v}</span></div>`;

function renderActivity(a,folder){
  const n=v=>v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length);
  let h=`<div class="hdr"><h2>${esc(a.名稱)}</h2>
    ${(a.別名||[]).map(x=>`<span class="chip">別名 ${esc(x)}</span>`).join('')}
    ${a.分類?`<span class="chip acc">${esc(a.分類)}</span>`:''}${a.類型?`<span class="chip">${esc(a.類型)}</span>`:''}
    ${a.系列?`<span class="chip">系列 ${esc(a.系列)}:${(a.輪替版本||[]).map(esc).join(' / ')}</span>`:''}</div>`;
  h+=`<div class="grid">${kv('時長',n(a.時長)?'null':esc(a.時長),n(a.時長))}${kv('結算',n(a.結算)?'null':esc(a.結算),n(a.結算))}
    ${kv('需求單位',esc(a.需求單位))}${kv('階段數',a.階段數)}${kv('全拿總需求',n(a.全拿總需求)?'null':a.全拿總需求,n(a.全拿總需求))}
    ${kv('是否補發獎勵',yn(a.是否補發獎勵))}
    ${kv('個人排行榜',`有:${yn(a.排行榜?.個人排行榜?.有)} 獎勵:${yn(a.排行榜?.個人排行榜?.獎勵)}`)}
    ${kv('家族排行榜',`有:${yn(a.排行榜?.家族排行榜?.有)} 獎勵:${yn(a.排行榜?.家族排行榜?.獎勵)}`)}</div>`;
  { const ep=a.事件積分||{}; const list=Array.isArray(ep)?ep:(ep.事件||[]); const type=Array.isArray(ep)?null:ep.類型;
    h+=`<section><h3>事件積分 <small>類型:${type===null||type===undefined?'<span class="nul">null(待確認)</span>':esc(type)}</small></h3>`;
    h+=list.length?list.map(e=>`<span class="tag">${esc(e.事件)} +${e.積分}</span>`).join(''):`<span class="nul">${type==='隨機'?'隨機事件,無固定倍數':type==='依階段'?'依各階段計分途徑,見下方「階段」':'原圖未列事件積分'}</span>`;
    if(ep.備註) h+=`<div class="sub" style="margin-top:6px">${esc(ep.備註)}</div>`;
    if(a.輪替版本事件積分) h+=`<div class="sub" style="margin-top:6px">輪替版本各自的事件積分:</div>${tableFromObjs(Object.entries(a.輪替版本事件積分).map(([k,v])=>({版本:k,事件積分:v.map(x=>`${x.事件}+${x.積分}`).join('、')})))}`;
    h+=`</section>`; }
  if(a.上榜門檻) h+=`<div class="grid">${Object.entries(a.上榜門檻).map(([k,v])=>kv('上榜門檻 '+k,v)).join('')}</div>`;
  if(a.設定表階段?.length) h+=`<section><h3>各階段積分來源 <small>遊戲設定表</small></h3>${tableFromObjs(a.設定表階段.flatMap(s=>s.途徑.map((t,i)=>({階段:i?'':`${s.階段} ${s.名稱??''}`,獲取途徑:t.遊戲內原文,每次積分:t.每次積分,積分上限:t.積分獲取上限??'無上限'}))))}</section>`;
  if(a.獎勵種類?.length) h+=`<div>獎勵種類:${a.獎勵種類.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`;
  if(a.全部領完總獎勵?.length) h+=`<div style="margin-top:6px">全部領完共可拿:${a.全部領完總獎勵.map(x=>`<span class="tag">${esc(x.道具)}${x.數量??''}${esc(x.單位??'')}</span>`).join('')}</div>`;
  if(a.備註?.length) h+=`<section><h3>備註</h3><ul class="notes">${a.備註.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`;
  // 階段
  const st=a.階段||[];
  if(st.length){
    const isRank=st.some(s=>s.獎勵原文&&typeof s.獎勵原文==='object');
    const isDay=st.some(s=>s.項目);
    h+=`<section><h3>階段 <small>${st.length} 階</small></h3>`;
    if(a.獎勵順序隨機) h+=`<p class="sub">獎勵順序隨機:下表的獎勵與階段不綁定,但不會重複領到,全部開完即可拿齊。</p>`;
    if(isDay){
      h+=`<table><thead><tr><th>星期</th><th>獲取途徑</th><th class="num">積分</th><th class="num">上限</th><th>上限所需數量</th><th>建議賽前多囤</th><th>遊戲內原文</th><th class="num">每次積分</th><th class="num">單日積分上限</th></tr></thead><tbody>`;
      for(const s of st){
        const items=s.項目||[],game=s.遊戲內說明||[],rows=Math.max(items.length,game.length);
        for(let i=0;i<rows;i++){const it=items[i]||{},g=game[i]||{};
          h+=`<tr>${i===0?`<td rowspan="${rows}"><b>${esc(s.名稱)}</b></td>`:''}<td>${esc(it.獲取途徑)}</td><td class="num">${esc(it.積分)}</td><td class="num">${esc(it.上限)}</td><td>${esc(it.上限所需數量)}</td><td>${it.建議賽前多囤?'<span class="ok">是</span>':''}</td><td>${esc(g.遊戲內原文)}</td><td class="num">${g.每次積分??''}</td><td class="num">${g.積分獲取上限===null?'無限':g.積分獲取上限??''}</td></tr>`;}
      }
      h+=`</tbody></table>`;
    }else if(isRank){
      h+=`<table><thead><tr><th>場次</th><th class="num">領取分</th><th>名次</th><th>獎勵</th><th>輪數獎勵</th></tr></thead><tbody>`;
      for(const s of st){const ks=Object.keys(s.獎勵原文);ks.forEach((k,i)=>{h+=`<tr>${i===0?`<td rowspan="${ks.length}"><b>${esc(s.名稱)}</b></td><td class="num" rowspan="${ks.length}">${fmtReq(s.需求).replace(/\D+/,'')}</td>`:''}<td>${k}</td><td>${fmtPrize(s.獎勵.filter(x=>String(x.名次)===k))}</td>${i===0?`<td rowspan="${ks.length}">${s.輪數獎勵?esc(s.輪數獎勵):'<span class="nul">—</span>'}</td>`:''}</tr>`;});}
      h+=`</tbody></table>`;
    }else{
      const hasAcc=st.some(s=>s.累積!==null&&s.累積!==undefined);
      h+=`<table><thead><tr><th>#</th><th>名稱</th><th>需求</th>${hasAcc?'<th class="num">累積</th>':''}<th>獎勵</th></tr></thead><tbody>`;
      for(const s of st) h+=`<tr><td>${s.階段}</td><td>${esc(s.名稱)}</td><td>${fmtReq(s.需求)}</td>${hasAcc?`<td class="num">${s.累積??''}</td>`:''}<td>${fmtPrize(s.獎勵)}</td></tr>`;
      h+=`</tbody></table>`;
    }
    h+=`</section>`;
  }
  if(a.額外獎勵?.length){
    h+=`<section><h3>額外獎勵</h3><table><thead><tr><th>項目</th><th>條件</th><th>獎勵</th></tr></thead><tbody>${a.額外獎勵.map(e=>`<tr><td>${esc(e.項目)}</td><td>${esc(e.需求||'')}</td><td>${e.獎勵?.length?fmtPrize(e.獎勵):esc(e.內容)}</td></tr>`).join('')}</tbody></table></section>`;
  }
  for(const who of ['個人','家族']){
    const rp=a[who+'排行獎勵']; if(!rp) continue;
    h+=`<section><h3>${who}排行獎勵</h3>${rp.說明?`<p class="sub">${esc(rp.說明)}</p>`:''}`;
    for(const [k,v] of Object.entries(rp)){ if(!Array.isArray(v)) continue;
      h+=`<h4 style="margin:10px 0 6px;font-size:14px">${esc(k)}</h4><table><thead><tr><th>名次</th><th>獎勵</th></tr></thead><tbody>${v.map(r=>`<tr><td>${esc(r.名次)}</td><td>${r.獎勵?.length?fmtPrize(r.獎勵):esc(r.獎勵原文)}</td></tr>`).join('')}</tbody></table>`;}
    h+=`</section>`;
  }
  h+=`<div class="bar"><a class="btn" href="${enc(ROOT+folder+'/獎勵.csv')}" download>下載 獎勵.csv</a><a class="btn" href="${enc(ROOT+folder+'/活動.json')}" target="_blank">開啟 活動.json</a></div>`;
  h+=`<details class="raw"><summary>原始 JSON</summary><pre>${esc(JSON.stringify(a,null,2))}</pre></details>`;
  return h;

function tableFromObjs(rows){
  if(!rows?.length) return '<div class="empty">無資料</div>';
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  return `<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${typeof r[c]==='object'&&r[c]!==null?esc(JSON.stringify(r[c])):esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function stageTable(stages,extraCols=[]){
  if(!stages?.length) return '<div class="empty">待補</div>';
  const mats=[];stages.forEach(s=>s.素材.forEach(m=>{const k=m.名稱+(m.碎片種類?'('+m.碎片種類+')':'');if(!mats.includes(k))mats.push(k)}));
  let h=`<table><thead><tr><th>等級</th>${mats.map(m=>`<th class="num">${esc(m)}</th><th class="num">${esc(m)}累計</th>`).join('')}${extraCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  const run={};  // 該階沒有這種素材時顯示 0,累計延續前一階
  for(const s of stages){h+=`<tr><td>${s.等級??((s.階??'')+'-'+(s.級??''))}</td>`;for(const m of mats){const x=s.素材.find(y=>y.名稱+(y.碎片種類?'('+y.碎片種類+')':'')===m);const q=x?x.數量:0;run[m]=x&&x.累計!=null?x.累計:((run[m]??0)+(q??0));h+=`<td class="num">${q??''}</td><td class="num">${run[m]}</td>`;}h+=extraCols.map(c=>`<td>${esc(s[c]??'')}</td>`).join('')+'</tr>';}
  return h+'</tbody></table>';
}

function md(t){ // tiny markdown: headings, tables, lists, code, paragraphs
  const lines=t.split('\n');let out='',i=0,inList=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  while(i<lines.length){const l=lines[i];
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      out+=`<table><thead><tr>${cells(rows[0]).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;continue;}
    if(inList&&!/^- /.test(l)){out+='</ul>';inList=false;}
    if(/^# /.test(l))out+=`<h1>${inline(l.slice(2))}</h1>`;else if(/^## /.test(l))out+=`<h2>${inline(l.slice(3))}</h2>`;
    else if(/^- /.test(l)){if(!inList){out+='<ul class="notes">';inList=true;}out+=`<li>${inline(l.slice(2))}</li>`;}
    else if(l.trim())out+=`<p>${inline(l)}</p>`;
    i++;}
  if(inList)out+='</ul>';return `<div class="md">${out}</div>`;
}

      ${c.傳記?.length?`<h4 style="margin:12px 0 6px">傳記</h4>${tableFromObjs(c.傳記.map(b=>({章:b.章,解鎖:`${b.解鎖星數}星`,標題:b.標題,內容:b.內容,獎勵:b.獎勵||''})))}`:''}</details>`;
  }
  if(d.羈絆?.length) h+=`<h4 style="margin:14px 0 6px">羈絆</h4>${tableFromObjs(d.羈絆.map(b=>({名稱:b.名稱,分類:b.分類||'',需要件數:b.需要件數,包含:(b.包含珍藏||b.包含珍寶||[]).join('、'),各級加成:(b.等級||[]).map(l=>`${l.級}級 ${l.屬性}`).join(' / ')})))}`;
  return h+`</section>`;
}

async function renderCar(){
  const d=await codex('坐騎');
  let h=`<div class="hdr"><h2>坐騎圖鑑</h2><span class="chip">${d.數量} 台</span></div><p class="sub">${esc(d.說明)}</p>`;
  h+=`<section>${searchBox('搜尋坐騎…')} <span class="codex-count sub"></span>`;
  for(const c of d.坐騎){
    h+=`<details data-k="${esc([c.名稱,c.品質,c.說明||''].join(' ').toLowerCase())}"><summary><b>${esc(c.名稱)}</b> <span class="chip acc">${esc(c.品質)}</span>${c.限定?'<span class="chip">限定</span>':''}${c.啟動屬性?`<span class="chip">${esc(c.啟動屬性)}</span>`:''}</summary>
      ${c.說明?`<p class="sub">${esc(c.說明)}</p>`:''}
      <div class="grid">${kv('啟動屬性',esc(c.啟動屬性||'—'))}${kv('取得方式',esc(c.取得方式||'—'))}${kv('戰鬥技能',esc(c.戰鬥技能?.名稱||'—'))}</div>
      ${c.坐騎技能?.length?tableFromObjs(c.坐騎技能.map(s=>({技能:s.名稱,說明:s.說明||''}))):''}</details>`;
  }
  return h+`</section>`;
}

async function renderSticker(){
  const d=await codex('貼紙集換');
  let h=`<div class="hdr"><h2>貼紙集換</h2><span class="chip">${d.數量} 本畫冊</span><span class="chip">${d.主題.length} 個主題</span></div><p class="sub">${esc(d.說明)}</p>`;
  if(d.檔期觀測?.length) h+=`<section><h3>檔期</h3><p class="sub">client 設定表裡沒有日期(伺服器開活動時才下發),下面是遊戲內實際看到的紀錄</p>${tableFromObjs(d.檔期觀測.map(r=>({觀測日:r.觀測日,當期主題:r.當期主題,畫冊編號:r.畫冊編號,來源:r.來源,備註:r.備註||''})))}</section>`;
  const p=d.抽貼紙||{};
  h+=`<section><h3>抽貼紙</h3><div class="grid">${kv('抽一次',esc(p.抽一次的消耗||'—'))}</div>
    ${tableFromObjs(p.品質庫||[])}
    <details style="margin-top:8px"><summary class="sub">抽到重複的機率(依該庫收集進度)</summary>${tableFromObjs(p.重複機率||[])}</details>
    <h3 style="margin-top:14px">貼紙商店套裝折扣</h3>${tableFromObjs(p.貼紙商店套裝折扣||[])}</section>`;
  h+=`<section><h3>畫冊</h3>${searchBox('搜尋畫冊 / 主題 / 貼紙名 / 獎勵…')} <span class="codex-count sub"></span>`;
  for(const b of d.畫冊){
    const names=(b.貼紙||[]).map(x=>x.名稱).join('、');
    const rw=(b.獎勵||[]).map(r=>`集${r.集滿張數}張→${r.獎勵}`).join(' / ');
    h+=`<details data-k="${esc([b.名稱,b.主題||'',names,rw].join(' ').toLowerCase())}"><summary><b>${esc(b.名稱)}</b> <span class="chip acc">${esc(b.主題||'')}</span><span class="chip">#${b.id}</span></summary>
      ${tableFromObjs((b.貼紙||[]).map(x=>({編號:x.id,貼紙:x.名稱,品質:x.品質||'—'})))}
      ${tableFromObjs((b.獎勵||[]).map(r=>({集滿張數:r.集滿張數,獎勵:r.獎勵,備註:r.備註||''})))}</details>`;
  }
  h+=`</section><ul class="notes">${(d.備註||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  return h;
}

async function renderEquip(){
  const d=await codex('裝備');
  let h=`<div class="hdr"><h2>裝備圖鑑</h2><span class="chip">${d.數量} 件</span></div><p class="sub">${esc(d.說明)}</p>`;
  h+=`<section>${searchBox('搜尋裝備 / 部位 / 品質…')} <span class="codex-count sub"></span>`;
  for(const e of d.裝備){
    const k=[e.名稱,e.部位,e.品質,e.說明||''].join(' ').toLowerCase();
    h+=`<details data-k="${esc(k)}"><summary><b>${esc(e.名稱)}</b> <span class="chip acc">${esc(e.品質)}</span><span class="chip">${esc(e.部位)}</span>${e.進階為?`<span class="chip">進階為 ${esc(e.進階為)}</span>`:''}</summary>
      ${e.說明?`<p class="sub">${esc(e.說明)}</p>`:''}
      ${tableFromObjs((e.星級||[]).map(s=>({星:s.星,基礎屬性:s.基礎屬性||'—',強化成長:s.強化成長||'—','滿強化(300級)':s['滿強化(300級)']||'—',特殊屬性:s.特殊屬性||'—',寶石孔:s.寶石孔,升星消耗:s.升星消耗||'—',分解返還:s.分解返還||'—'})))}</details>`;
  }
  h+=`</section><section><h3>套裝加成</h3>${tableFromObjs(d.套裝加成||[])}</section>`;
  h+=`<section><h3>隨機詞條</h3><p class="sub">裝備會帶隨機詞條,稀有度越高越難出</p>${tableFromObjs((d.隨機詞條||[]).map(r=>({屬性:r.屬性,稀有度:r.稀有度,數值範圍:r.數值範圍})))}</section>`;
  return h;
}

const GROWTH={};
function fillGrowth(el){
  if(el.dataset.done||!el.open) return;
  el.dataset.done='1';
  const d=GROWTH[el.dataset.page];
  const g=d?.區塊?.[+el.dataset.b]?.分組?.[+el.dataset.g];
  el.querySelector('.tpl-body').innerHTML=g?tableFromObjs(g.表格):'<div class="empty">沒有資料</div>';
}
async function renderGrowth(name){
  const d=GROWTH[name] ??= await fetchJ(ROOT+'91_養成/'+name+'.json');
  let h=`<div class="hdr"><h2>${esc(name)}養成</h2></div><p class="sub">${esc(d.說明)}</p>`;
  d.區塊.forEach((b,bi)=>{
    h+=`<section><h3>${esc(b.標題)}</h3>${b.說明?`<p class="sub">${esc(b.說明)}</p>`:''}`;
    if(b.表格?.length) h+=tableFromObjs(b.表格);
    (b.分組||[]).forEach((g,gi)=>{
      h+=`<details style="margin-top:8px" data-page="${esc(name)}" data-b="${bi}" data-g="${gi}" ontoggle="fillGrowth(this)"><summary class="sub">${esc(g.標題)}</summary><div class="tpl-body"><div class="empty">展開中…</div></div></details>`;
    });
    h+=`</section>`;
  });
  return h;
}

async function renderItemCodex(){
  const d=await codex('道具');
  let h=`<div class="hdr"><h2>道具圖鑑</h2><span class="chip">${d.數量} 個</span><span class="chip acc">${d.有圖} 個有圖</span></div>
    <p class="sub">${esc(d.說明)}</p>`;
  h+=`<section>${searchBox('搜尋道具名稱 / 說明 / 品質 / 分頁…')} <span class="codex-count sub"></span>`;
  const tabs=d.分頁||[];
  for(const tab of tabs){
    const list=d.道具.filter(x=>x.背包分頁===tab);
    if(!list.length) continue;
    h+=`<h3 style="margin-top:16px">背包：${esc(tab)} <small>${list.length} 個</small></h3><div class="icards">`;
    for(const it of list){
      const k=[it.名稱,it.背包分頁,it.分類,it.品質,it.說明||''].join(' ').toLowerCase();
      const qc=d.品質色?.[it.品質];
      const style=qc?` style="--ql:${qc.淺底};--qd:${qc.深底}" title="${esc(it.品質)}"`:'';
      const pic=it.圖
        ? `<div class="pic"${style}><img src="${enc('圖片/道具/'+it.圖)}" alt="${esc(it.名稱)}" loading="lazy" width="64" height="64"></div>`
        : `<div class="pic none"${style}>沒有<br>圖檔</div>`;
      h+=`<div class="icard" data-k="${esc(k)}">${pic}<div class="txt">
        <div class="nm">${esc(it.名稱)}</div>
        <div class="tags"><span class="chip">${esc(it.分類)}</span>${it.售價?`<span class="chip">賣 ${it.售價}</span>`:''}</div>
        <div class="ds">${rich(it.說明||'—')}</div></div></div>`;
    }
    h+=`</div>`;
  }
  return h+`</section>`;
}

async function renderItems(){
  const d=await codex('道具');
  let h=`<div class="hdr"><h2>道具查詢</h2><span class="chip">${d.數量} 個</span></div><p class="sub">${esc(d.說明)}</p>`;
  h+=`<section>${searchBox('搜尋道具名稱 / 說明…')} <span class="codex-count sub"></span>
    <table><thead><tr><th>名稱</th><th>分類</th><th>品質</th><th>說明</th></tr></thead><tbody>`;
  for(const it of d.道具){
    const k=[it.名稱,it.分類,it.品質,it.說明||''].join(' ').toLowerCase();
    h+=`<tr data-k="${esc(k)}"><td>${esc(it.名稱)}</td><td>${esc(it.分類)}</td><td>${esc(it.品質)}</td><td class="sub">${rich((it.說明||'').replace(/\n/g,' '))}</td></tr>`;
  }
  return h+`</tbody></table></section>`;
}

async function show(id){
  const v=$('#view'); v.innerHTML='<div class="empty">載入中…</div>';
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  $('#side').classList.remove('open');
  try{
    if(id==='overview') v.innerHTML=await renderOverview();
    else if(id==='cult') v.innerHTML=await renderCult();
    else if(id==='partner') v.innerHTML=await renderPartners();
    else if(id==='dress') v.innerHTML=await renderDress();
    else if(id==='pet') v.innerHTML=await renderPets();
    else if(id==='ability') v.innerHTML=await renderAbilities();
    else if(id==='guardian') v.innerHTML=await renderGuardian();
    else if(id==='collect') v.innerHTML=await renderCollect();
    else if(id==='car') v.innerHTML=await renderCar();
    else if(id==='equip') v.innerHTML=await renderEquip();
    else if(id==='sticker') v.innerHTML=await renderSticker();
    else if(id.startsWith('g_')) v.innerHTML=await renderGrowth(id.slice(2));
    else if(id==='itemdex') v.innerHTML=await renderItemCodex();
    else if(id==='item') v.innerHTML=await renderItems();
    else if(id==='doc') v.innerHTML=`<div class="hdr"><h2>欄位說明</h2></div>`+md(await fetchT(ROOT+'欄位說明.md'));
    else { const a=await fetchJ(ROOT+id+'/活動.json'); v.innerHTML=renderActivity(a,id); }
    document.title=(INDEX.find(x=>x.資料夾===id)?.名稱||SPECIAL.find(s=>s.id===id)?.name||id)+' · 巡夢少女 活動表格';
  }catch(e){v.innerHTML=`<div class="empty">載入失敗:${esc(e.message)}</div>`;}
  window.scrollTo(0,0);
}
function buildNav(filter=''){
  const f=filter.trim().toLowerCase();
  let h='<div class="nav-group">活動</div>';
  for(const a of INDEX){ if(f&&!(a.名稱+a.資料夾+(a.分類||'')+(a.類型||'')).toLowerCase().includes(f)) continue;
    h+=`<a href="#${encodeURIComponent(a.資料夾)}" data-id="${esc(a.資料夾)}"><span>${esc(a.名稱)}</span><small>${esc(a.分類||'')}</small></a>`;}
  const link=s=>`<a href="#${s.id}" data-id="${s.id}"><span>${s.name}</span></a>`;
  const keep=s=>!f||s.name.toLowerCase().includes(f);
  h+='<div class="nav-group">圖鑑</div>'+CODEX_PAGES.filter(keep).map(link).join('');
  h+='<div class="nav-group">養成</div>'+GROWTH_PAGES.filter(keep).map(link).join('');
  h+='<div class="nav-group">其他</div>'+[{id:'overview',name:'總覽與規則'},{id:'doc',name:'欄位說明'}].filter(keep).map(link).join('');
  $('#nav').innerHTML=h;
  const cur=decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===cur));
}
(async()=>{
  try{INDEX=await fetchJ(ROOT+'目錄.json');}catch(e){$('#view').innerHTML=`<div class="empty">讀不到 整理/目錄.json:${esc(e.message)}</div>`;return;}
  buildNav();
  $('#q').addEventListener('input',e=>buildNav(e.target.value));
  $('#menu').addEventListener('click',()=>$('#side').classList.toggle('open'));
  const go=()=>show(decodeURIComponent(location.hash.slice(1))||INDEX[0].資料夾);
  if(location.search.includes('print')) document.body.classList.add('print');
  window.addEventListener('hashchange',go); go();
})();
</script>
